appId: com.nemt.platform
productName: NEMT Platform
copyright: Copyright © 2026 NEMT Lab

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

extraResources:
  - from: src/nemt-os
    to: nemt-os
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: "${productName}-${version}-Setup.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NEMT Platform
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  category: public.app-category.finance

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: build/icons
  category: Finance

asar: true
compression: maximum
